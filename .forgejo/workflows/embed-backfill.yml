name: Embed backfill

# First pass (or a model change): embed the docs cache in long runs instead of
# 40 min a night. The runner kills any job at 3 h whatever timeout-minutes
# says (run 139 asked for 340 min and was cancelled at 3h0m), so one run
# embeds ~130 min worth (~85k pages at 667/min) and leaves ~30 min for the
# neighbour pass (697 s at 114k pages, quadratic); dispatch it again until
# the log shows pending=0. Writes only the docs-ssh-cache volume
# (/cache/embed); the next build.yml run ships the result. Shares build.yml's
# concurrency group so the two never write the embedding state at once.
#
# To ship the result without anything else watching: dispatch build.yml right
# after this one. The shared group with cancel-in-progress: false makes the
# build wait (status "waiting") until the backfill ends, then run - checked
# 2026-10-30 on Forgejo 16.0.6 (run 140 queued behind run 139 with 3 free
# runner slots).
on:
  workflow_dispatch:
    inputs:
      budget_s:
        description: "Embedding time budget in seconds (runner cap is 3 h; the neighbour pass needs ~30 min after it)"
        type: string
        default: "7800"

concurrency:
  group: docker-push
  cancel-in-progress: false

env:
  CACHE_VOLUME: docs-ssh-cache
  HELPER_IMAGE: alpine:3.24

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v7
      - name: Embed
        run: sh embed/ci-run.sh /tmp/_related.tsv "${{ inputs.budget_s }}"
