name: Embed backfill

# First pass (or a model change): embed the whole docs cache in one long run
# instead of an hour a night. Writes only the docs-ssh-cache volume
# (/cache/embed); the next build.yml run ships the result. Shares build.yml's
# concurrency group so the two never write the embedding state at once.
on:
  workflow_dispatch:
    inputs:
      budget_s:
        description: "Embedding time budget in seconds (170k pages at ~667/min is ~4.3 h)"
        type: string
        default: "18000"

concurrency:
  group: docker-push
  cancel-in-progress: false

env:
  CACHE_VOLUME: docs-ssh-cache
  HELPER_IMAGE: alpine:3.24

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - name: Embed
        run: sh embed/ci-run.sh /tmp/_related.tsv "${{ inputs.budget_s }}"
