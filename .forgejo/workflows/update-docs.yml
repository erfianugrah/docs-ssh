name: Update Docs

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: docker-push
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Fetch docs, build, push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: erfianugrah
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch docs
        timeout-minutes: 180
        run: pnpm fetch-docs
        env:
          DOCS_OUT_DIR: ${{ github.workspace }}/docs
          DOCS_WORK_DIR: /tmp/docs-work
          DOCS_MAX_AGE: "0"

      - name: Generate date + version tags
        id: tag
        run: |
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "version=$(git describe --tags --abbrev=0)-daily.$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        with:
          context: .
          push: true
          tags: |
            ghcr.io/erfianugrah/docs-ssh:latest
            ghcr.io/erfianugrah/docs-ssh:${{ steps.tag.outputs.date }}
          build-args: |
            DOCS_PREBUILT=true
            VERSION=${{ steps.tag.outputs.version }}
            SSH_HOST=${{ vars.DOCS_SSH_HOST || 'docs.erfi.io' }}
            SSH_PORT=${{ vars.DOCS_SSH_PORT || '2222' }}
          # no gha cache: the runner cache proxy is unreachable from job
          # containers (same as composer); BuildKit daemon cache persists.

