name: Build

# One workflow for every image build: tag releases, the daily refresh and
# manual runs. They all produce "code at a ref + a docs tree"; the plan step
# (src/ci/plan-cli.ts, unit-tested in tests/unit/ci/) decides whether the
# docs need fetching, from the record the last fetch left in the persistent
# cache (docs/_build.json: fetchedAt + commit):
#   - tag       : always builds; fetches only if docs are >= 20h old or
#                 fetcher code changed since the last fetch
#   - schedule  : skips entirely when docs are < 20h old (a release fetched
#                 them) and fetcher code is unchanged; otherwise fetches
#   - dispatch  : like tag; input refresh=true forces a full refetch
# Warm fetches reuse the cache (DOCS_MAX_AGE=36h per source, git clones
# kept), so only changed sources are refetched; a fetcher-code change forces
# DOCS_MAX_AGE=0 so every source is regenerated with the new code.
#
# Cache: docker volume `docs-ssh-cache` on the router daemon (the job talks to
# the host daemon via the automounted socket), holding docs/ and work/. It is
# moved in and out with `docker cp` through a throwaway container, so no
# runner volume allowlist is needed. Deleting the volume just means the next
# run does a cold fetch (~2h20m).

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Refetch every source (ignore the cache freshness)"
        type: boolean
        default: false

concurrency:
  group: docker-push
  cancel-in-progress: false

env:
  CACHE_VOLUME: docs-ssh-cache
  HELPER_IMAGE: alpine:3.24

jobs:
  # verify gates tag releases only. It is NOT skipped at job level on
  # schedule/dispatch: Forgejo skips a job whose `needs` was skipped even under
  # `if: !failure() && !cancelled()`, which silently turned every daily refresh
  # into a no-op (2026-10-01..05). Instead the job always runs and each step is
  # gated, so on schedule/dispatch it succeeds as a no-op and build-and-push's
  # `needs` is satisfied however the runner treats skips.
  verify:
    name: Verify (typecheck, unit, e2e, tools.sh sync)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'

      # Private Docker daemon for this job. The runner's shared host socket
      # resolves bind mounts and published ports on the router, not in this
      # container, so tests that mount the workspace or dial localhost need
      # their own daemon (runs as root under a privileged runner; vfs avoids nested overlay).
      - name: Start job-private dockerd
        if: github.event_name == 'push'
        run: |
          sh -c 'dockerd --host=unix:///tmp/dind.sock --data-root=/tmp/dind-data --storage-driver=vfs >/tmp/dockerd.log 2>&1 &'
          for i in $(seq 1 30); do docker -H unix:///tmp/dind.sock info >/dev/null 2>&1 && break; sleep 1; done
          echo "DOCKER_HOST=unix:///tmp/dind.sock" >> "$GITHUB_ENV"
          docker -H unix:///tmp/dind.sock info --format 'private dockerd: {{.ServerVersion}} {{.Driver}}'
      - uses: actions/setup-node@v7
        if: github.event_name == 'push'
        with:
          node-version: 22

      - name: Install pnpm
        if: github.event_name == 'push'
        run: npm install -g pnpm@10

      - name: Install dependencies
        if: github.event_name == 'push'
        run: pnpm install --frozen-lockfile

      - name: Verify tools.sh is in sync
        if: github.event_name == 'push'
        run: pnpm generate:tools && git diff --exit-code commands/tools.sh

      - name: Typecheck
        if: github.event_name == 'push'
        run: pnpm lint

      - name: Run unit tests
        if: github.event_name == 'push'
        run: pnpm test:coverage

      - name: Run E2E tests
        if: github.event_name == 'push'
        run: pnpm test:e2e


  build-and-push:
    name: Plan, fetch (if needed), build, push, deploy
    needs: verify
    # verify's steps run for tags only; on schedule/dispatch it succeeds as a
    # no-op and main is built without it (CI already gated every push to main).
    runs-on: ubuntu-latest
    timeout-minutes: 175
    outputs:
      built: ${{ steps.plan.outputs.build }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore docs cache from volume
        run: |
          docker volume create "$CACHE_VOLUME" >/dev/null
          c=$(docker create -v "$CACHE_VOLUME":/cache "$HELPER_IMAGE" true)
          echo "CACHE_HELPER=$c" >> "$GITHUB_ENV"
          mkdir -p docs /tmp/docs-work
          # docker cp of a missing path fails; an empty volume is a cold start.
          docker cp "$c":/cache/docs/. docs/ 2>/dev/null || echo "cache: no docs yet (cold start)"
          docker cp "$c":/cache/work/. /tmp/docs-work/ 2>/dev/null || echo "cache: no work dir yet"
          echo "restored: $(find docs -name '*.md' | wc -l) md files, $(du -sh docs | cut -f1)"
          if [ -f docs/_build.json ]; then echo "last fetch: $(cat docs/_build.json)"; fi

      - name: Plan
        id: plan
        run: |
          case "${{ github.event_name }}" in
            push) event=tag ;;
            schedule) event=schedule ;;
            *) event=dispatch ;;
          esac
          changed=unknown
          last_commit=$(jq -r '.commit // empty' docs/_build.json 2>/dev/null || true)
          if [ -n "$last_commit" ] && git cat-file -e "$last_commit^{commit}" 2>/dev/null; then
            if git diff --quiet "$last_commit" HEAD -- src/ingestors src/normaliser src/application src/domain src/shared src/index.ts package.json pnpm-lock.yaml; then
              changed=false
            else
              changed=true
            fi
          fi
          echo "fetcher changed since last fetch: $changed"
          EVENT=$event FORCE_REFRESH="${{ inputs.refresh || false }}" \
            LAST_FETCH_FILE=docs/_build.json FETCHER_CHANGED=$changed \
            node --import tsx/esm src/ci/plan-cli.ts >> "$GITHUB_OUTPUT"

      - name: Install Jinja2 (TRaSH-Guides converter)
        if: steps.plan.outputs.fetch == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jinja2 package
        if: steps.plan.outputs.fetch == 'true'
        run: pip install jinja2

      - name: Fetch docs
        if: steps.plan.outputs.fetch == 'true'
        timeout-minutes: 160
        run: |
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          pnpm fetch-docs
          jq -n --arg t "$started" --arg c "$(git rev-parse HEAD)" \
            --arg r "${{ steps.plan.outputs.reason }}" --arg m "$DOCS_MAX_AGE" \
            '{fetchedAt: $t, commit: $c, reason: $r, docsMaxAge: ($m | tonumber)}' > docs/_build.json
        env:
          DOCS_OUT_DIR: ${{ github.workspace }}/docs
          DOCS_WORK_DIR: /tmp/docs-work
          DOCS_MAX_AGE: ${{ steps.plan.outputs.docs_max_age }}

      - name: Save docs cache to volume
        # Save right after the fetch, before the image build, so a failed
        # build/push/deploy never throws away a 2h fetch.
        if: steps.plan.outputs.fetch == 'true'
        run: |
          c="$CACHE_HELPER"
          docker run --rm -v "$CACHE_VOLUME":/cache "$HELPER_IMAGE" sh -c 'rm -rf /cache/docs.new /cache/work.new && mkdir -p /cache/docs.new /cache/work.new'
          docker cp docs/. "$c":/cache/docs.new/
          docker cp /tmp/docs-work/. "$c":/cache/work.new/
          docker run --rm -v "$CACHE_VOLUME":/cache "$HELPER_IMAGE" sh -c 'rm -rf /cache/docs /cache/work && mv /cache/docs.new /cache/docs && mv /cache/work.new /cache/work && du -sh /cache/docs /cache/work'

      - name: Remove cache helper container
        if: always() && env.CACHE_HELPER != ''
        run: docker rm -f "$CACHE_HELPER" >/dev/null || true

      - name: Image tags
        id: tags
        if: steps.plan.outputs.build == 'true'
        run: |
          img=ghcr.io/erfianugrah/docs-ssh
          date=$(date -u +%Y%m%d)
          if [ "${{ github.event_name }}" = push ]; then
            v="${GITHUB_REF_NAME#v}"
            version="$GITHUB_REF_NAME"
            tags="$img:latest,$img:$v,$img:${v%.*},$img:$date"
          else
            version="$(git describe --tags --abbrev=0)-daily.$date"
            tags="$img:latest,$img:$date"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version tags=$tags"

      - name: Set up Docker Buildx
        if: steps.plan.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.plan.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: erfianugrah
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            DOCS_PREBUILT=true
            VERSION=${{ steps.tags.outputs.version }}
            SSH_HOST=${{ vars.DOCS_SSH_HOST || 'docs.erfi.io' }}
            SSH_PORT=${{ vars.DOCS_SSH_PORT || '2222' }}
          # no gha cache: the runner cache proxy is unreachable from job
          # containers (same as composer); BuildKit daemon cache persists.

      - name: Deploy to Composer (async)
        if: steps.plan.outputs.build == 'true'
        id: deploy
        # ?async=true returns {job_id} immediately; we poll the job in the
        # next step so failures surface composer's actual error rather than
        # a generic SSH-banner timeout 60s later.
        run: |
          resp_file="$(mktemp)"
          http_code=$(curl -s \
            --connect-timeout 30 \
            --max-time 120 \
            --retry 6 \
            --retry-delay 15 \
            --retry-connrefused \
            --retry-all-errors \
            -X POST \
            "${{ secrets.COMPOSER_URL }}/api/v1/stacks/docs-ssh/deploy?async=true" \
            -H "Authorization: Bearer ${{ secrets.COMPOSER_API_KEY }}" \
            -H "X-Requested-With: XMLHttpRequest" \
            -o "$resp_file" -w '%{http_code}')
          response=$(cat "$resp_file"); rm -f "$resp_file"
          echo "composer response (HTTP $http_code): $(printf '%s' "$response" | head -c 500)"

          # A non-JSON body means we reached something other than the API -
          # almost always the Caddy proof-of-work / WAF challenge page that
          # gets served to GitHub runner IPs. Surface that plainly instead of
          # a cryptic `jq: parse error: Invalid numeric literal`.
          if ! printf '%s' "$response" | jq -e . >/dev/null 2>&1; then
            echo "::error::composer deploy returned non-JSON (HTTP $http_code) - likely a WAF/proof-of-work challenge, not the API. Body (first 300 chars): $(printf '%s' "$response" | head -c 300 | tr '\n' ' ')"
            exit 1
          fi
          if [ "$http_code" != "200" ] && [ "$http_code" != "202" ]; then
            echo "::error::composer deploy failed with HTTP $http_code: $response"
            exit 1
          fi

          job_id=$(printf '%s' "$response" | jq -r '.job_id // empty')
          if [ -z "$job_id" ]; then
            echo "::error::composer accepted deploy but returned no job_id: $response"
            exit 1
          fi
          echo "Deploy queued, job_id=$job_id"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Composer job to finish
        if: steps.plan.outputs.build == 'true'
        # Polls /api/v1/jobs/{id} every 5s for up to 10 minutes. On 'failed'
        # surfaces composer's error+output to the CI log so we don't have to
        # SSH to the host to find out what went wrong.
        run: |
          job_id="${{ steps.deploy.outputs.job_id }}"
          for i in $(seq 1 120); do
            job=$(curl -sf \
              --connect-timeout 10 --max-time 20 --retry 2 --retry-all-errors \
              -H "Authorization: Bearer ${{ secrets.COMPOSER_API_KEY }}" \
              "${{ secrets.COMPOSER_URL }}/api/v1/jobs/$job_id" || echo '{}')
            if ! printf '%s' "$job" | jq -e . >/dev/null 2>&1; then
              echo "::warning::poll #$i got a non-JSON response (likely WAF/proof-of-work challenge); retrying"
              sleep 5; continue
            fi
            status=$(printf '%s' "$job" | jq -r '.status // "unknown"')
            case "$status" in
              completed)
                echo "job $job_id completed in $((i*5))s"
                exit 0 ;;
              failed)
                echo "::error::composer job failed"
                echo "--- error ---"
                echo "$job" | jq -r '.error // "(no error field)"'
                echo "--- output (last 4KB) ---"
                echo "$job" | jq -r '.output // ""' | tail -c 4096
                exit 1 ;;
              pending|running)
                : ;;
              *)
                echo "::warning::unexpected job status '$status' (raw: $job)" ;;
            esac
            sleep 5
          done
          echo "::error::composer job $job_id did not finish within 10 minutes"
          exit 1

  smoke:
    name: Post-deploy smoke against live
    needs: build-and-push
    if: needs.build-and-push.outputs.built == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for cascade redeploys to settle
        # build-and-push waits on its own deploy job_id, but composer can queue
        # *cascade* sync_redeploy jobs on dependent stacks ~30-60s later. The
        # canonical case: host-mode caddy on the same host fronts docs-ssh:2222
        # and is auto-redeployed when docs-ssh changes, which tears down the
        # public listener for ~10s mid-smoke. Poll the jobs API for any
        # in-flight job whose target is docs-ssh or caddy, and require a stable
        # window of clean polls before proceeding.
        env:
          COMPOSER_URL: ${{ secrets.COMPOSER_URL }}
          COMPOSER_API_KEY: ${{ secrets.COMPOSER_API_KEY }}
        run: |
          stable_window=6     # need 6 consecutive clean polls (~30s)
          max_iterations=72   # cap total wait at ~6 minutes
          poll_interval=5
          clean=0
          for i in $(seq 1 $max_iterations); do
            jobs=$(curl -sf \
              --connect-timeout 10 --max-time 20 --retry 2 --retry-all-errors \
              -H "Authorization: Bearer ${COMPOSER_API_KEY}" \
              "${COMPOSER_URL}/api/v1/jobs?limit=50" || echo '{"jobs":[]}')
            in_flight=$(echo "$jobs" | jq -r '
              .jobs[]?
              | select((.target == "docs-ssh" or .target == "caddy")
                       and (.status == "running" or .status == "pending"))
              | "\(.type)/\(.target)/\(.status)/\(.id)"' | head -5)
            if [ -n "$in_flight" ]; then
              echo "iter $i: in-flight related jobs:"
              echo "$in_flight" | sed 's/^/  /'
              clean=0
            else
              clean=$((clean + 1))
              echo "iter $i: no related in-flight jobs (clean=$clean/$stable_window)"
              if [ $clean -ge $stable_window ]; then
                echo "settled after $((i * poll_interval))s"
                exit 0
              fi
            fi
            sleep $poll_interval
          done
          echo "::error::cascade jobs did not settle within $((max_iterations * poll_interval))s"
          exit 1

      - name: Wait for live SSH banner
        # Composer's job is already 'completed' by the time we get here
        # (build-and-push only finishes after the job poll succeeds), but
        # the new container still needs ~5-15s for sshd inside it to be
        # ready. Bounded poll on banner exchange.
        run: |
          for i in $(seq 1 15); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o LogLevel=ERROR -o ConnectTimeout=2 \
                   -p 2222 docs@${{ vars.DOCS_SSH_HOST || 'docs.erfi.io' }} \
                   'echo ok' > /dev/null 2>&1; then
              echo "live server reachable after ${i}x2s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::live server unreachable after 30s; aborting smoke"
          exit 1

      - name: Smoke against live
        env:
          DOCS_SSH_HOST: ${{ vars.DOCS_SSH_HOST || 'docs.erfi.io' }}
          DOCS_SSH_PORT: ${{ vars.DOCS_SSH_PORT || '2222' }}
        run: pnpm test:smoke
