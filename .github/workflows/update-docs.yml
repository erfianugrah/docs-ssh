name: Update Docs

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: docker-push
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Fetch docs & publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          # needed for git describe (latest release tag for the VERSION build-arg)
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch docs
        run: pnpm fetch-docs
        env:
          DOCS_OUT_DIR: ${{ github.workspace }}/docs
          DOCS_WORK_DIR: /tmp/docs-work
          DOCS_MAX_AGE: "0"

      - name: Generate date + version tags
        id: tag
        # VERSION must start with v<digit> - the landing-page JS guard
        # (/^v\d/) blanks anything else to "dev".
        run: |
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "version=$(git describe --tags --abbrev=0)-daily.$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.date }}
          build-args: |
            DOCS_PREBUILT=true
            VERSION=${{ steps.tag.outputs.version }}
            SSH_HOST=${{ vars.DOCS_SSH_HOST || 'docs.erfi.io' }}
            SSH_PORT=${{ vars.DOCS_SSH_PORT || '2222' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fire-and-forget redeploy via the Composer webhook receiver
      # (POST /api/v1/hooks/{id}, HMAC-signed generic payload). No API key
      # needed: the hook URL + HMAC secret are the only credentials.
      # The deploy runs async on the host; its outcome is tracked as a
      # webhook delivery + job in the Composer UI and surfaced via
      # Composer-side notifications - CI does not poll it. CI only asserts
      # the hook accepted the trigger (non-200 / non-JSON = red workflow).
      - name: Trigger Composer redeploy via webhook
        run: |
          payload_file="$(mktemp)"
          printf '{"ref":"refs/heads/main","branch":"main","commit_sha":"%s","event":"daily-docs-update"}' \
            "${{ github.sha }}" > "$payload_file"
          sig=$(openssl dgst -sha256 -hmac "${{ secrets.COMPOSER_WEBHOOK_SECRET }}" "$payload_file" | awk '{print $NF}')
          resp_file="$(mktemp)"
          http_code=$(curl -s \
            --connect-timeout 30 \
            --max-time 120 \
            --retry 4 \
            --retry-delay 20 \
            --retry-connrefused \
            --retry-all-errors \
            -X POST \
            "${{ secrets.COMPOSER_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: sha256=$sig" \
            --data-binary @"$payload_file" \
            -o "$resp_file" -w '%{http_code}')
          response=$(cat "$resp_file"); rm -f "$resp_file" "$payload_file"
          echo "composer webhook response (HTTP $http_code): $(printf '%s' "$response" | head -c 500)"

          # A non-JSON body means we reached something other than the API -
          # almost always the Caddy proof-of-work / WAF challenge page that
          # gets served to GitHub runner IPs. Surface that plainly instead of
          # a cryptic `jq: parse error: Invalid numeric literal`.
          if ! printf '%s' "$response" | jq -e . >/dev/null 2>&1; then
            echo "::error::composer webhook returned non-JSON (HTTP $http_code) - likely a WAF/proof-of-work challenge, not the API. Body (first 300 chars): $(printf '%s' "$response" | head -c 300 | tr '\n' ' ')"
            exit 1
          fi
          if [ "$http_code" != "200" ]; then
            echo "::error::composer webhook failed with HTTP $http_code: $response"
            exit 1
          fi
          status=$(printf '%s' "$response" | jq -r '.status // empty')
          if [ "$status" != "accepted" ]; then
            echo "::error::composer webhook did not accept the deploy: $response"
            exit 1
          fi
          echo "Redeploy accepted: $(printf '%s' "$response" | jq -c '{stack, delivery_id, job_id}')"
