name: Update Docs

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: docker-push
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Fetch docs & publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch docs
        run: pnpm fetch-docs
        env:
          DOCS_OUT_DIR: ${{ github.workspace }}/docs
          DOCS_WORK_DIR: /tmp/docs-work
          DOCS_MAX_AGE: "0"

      - name: Generate date tag
        id: tag
        run: echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.date }}
          build-args: |
            DOCS_PREBUILT=true
            VERSION=daily-${{ steps.tag.outputs.date }}
            SSH_HOST=${{ vars.DOCS_SSH_HOST || 'docs.erfi.io' }}
            SSH_PORT=${{ vars.DOCS_SSH_PORT || '2222' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Composer (async)
        id: deploy
        run: |
          response=$(curl -sf \
            --connect-timeout 30 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 15 \
            --retry-connrefused \
            -X POST \
            "${{ secrets.COMPOSER_URL }}/api/v1/stacks/docs-ssh/deploy?async=true" \
            -H "Authorization: Bearer ${{ secrets.COMPOSER_API_KEY }}" \
            -H "X-Requested-With: XMLHttpRequest")
          echo "composer response: $response"
          job_id=$(echo "$response" | jq -r '.job_id // empty')
          if [ -z "$job_id" ]; then
            echo "::error::composer accepted deploy but returned no job_id"
            exit 1
          fi
          echo "Deploy queued, job_id=$job_id"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Composer job to finish
        run: |
          job_id="${{ steps.deploy.outputs.job_id }}"
          for i in $(seq 1 120); do
            job=$(curl -sf \
              --connect-timeout 10 --max-time 20 \
              -H "Authorization: Bearer ${{ secrets.COMPOSER_API_KEY }}" \
              "${{ secrets.COMPOSER_URL }}/api/v1/jobs/$job_id" || echo '{}')
            status=$(echo "$job" | jq -r '.status // "unknown"')
            case "$status" in
              completed)
                echo "job $job_id completed in $((i*5))s"
                exit 0 ;;
              failed)
                echo "::error::composer job failed"
                echo "--- error ---"
                echo "$job" | jq -r '.error // "(no error field)"'
                echo "--- output (last 4KB) ---"
                echo "$job" | jq -r '.output // ""' | tail -c 4096
                exit 1 ;;
              pending|running)
                : ;;
              *)
                echo "::warning::unexpected job status '$status' (raw: $job)" ;;
            esac
            sleep 5
          done
          echo "::error::composer job $job_id did not finish within 10 minutes"
          exit 1
