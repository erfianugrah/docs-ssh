name: Update Docs

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: docker-push
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Fetch docs, build, push, deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch docs
        timeout-minutes: 180
        run: pnpm fetch-docs
        env:
          DOCS_OUT_DIR: ${{ github.workspace }}/docs
          DOCS_WORK_DIR: /tmp/docs-work
          DOCS_MAX_AGE: "0"

      - name: Generate date + version tags
        id: tag
        run: |
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "version=$(git describe --tags --abbrev=0)-daily.$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.date }}
          build-args: |
            DOCS_PREBUILT=true
            VERSION=${{ steps.tag.outputs.version }}
            SSH_HOST=${{ vars.DOCS_SSH_HOST || 'docs.erfi.io' }}
            SSH_PORT=${{ vars.DOCS_SSH_PORT || '2222' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Deploy to Composer (async)
        id: deploy
        run: |
          resp_file="$(mktemp)"
          http_code=$(curl -s \
            --connect-timeout 30 \
            --max-time 120 \
            --retry 6 \
            --retry-delay 15 \
            --retry-connrefused \
            --retry-all-errors \
            -X POST \
            "${{ secrets.COMPOSER_URL }}/api/v1/stacks/docs-ssh/deploy?async=true" \
            -H "Authorization: Bearer ${{ secrets.COMPOSER_API_KEY }}" \
            -H "X-Requested-With: XMLHttpRequest" \
            -o "$resp_file" -w '%{http_code}')
          response=$(cat "$resp_file"); rm -f "$resp_file"
          echo "composer response (HTTP $http_code): $(printf '%s' "$response" | head -c 500)"

          if ! printf '%s' "$response" | jq -e . >/dev/null 2>&1; then
            echo "::error::composer deploy returned non-JSON (HTTP $http_code) - likely a WAF/proof-of-work challenge, not the API. Body (first 300 chars): $(printf '%s' "$response" | head -c 300 | tr '\n' ' ')"
            exit 1
          fi
          if [ "$http_code" != "200" ] && [ "$http_code" != "202" ]; then
            echo "::error::composer deploy failed with HTTP $http_code: $response"
            exit 1
          fi

          job_id=$(printf '%s' "$response" | jq -r '.job_id // empty')
          if [ -z "$job_id" ]; then
            echo "::error::composer accepted deploy but returned no job_id: $response"
            exit 1
          fi
          echo "Deploy queued, job_id=$job_id"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Composer job to finish
        run: |
          job_id="${{ steps.deploy.outputs.job_id }}"
          for i in $(seq 1 120); do
            job=$(curl -sf \
              --connect-timeout 10 --max-time 20 --retry 2 --retry-all-errors \
              -H "Authorization: Bearer ${{ secrets.COMPOSER_API_KEY }}" \
              "${{ secrets.COMPOSER_URL }}/api/v1/jobs/$job_id" || echo '{}')
            if ! printf '%s' "$job" | jq -e . >/dev/null 2>&1; then
              echo "::warning::poll #$i got a non-JSON response (likely WAF/proof-of-work challenge); retrying"
              sleep 5; continue
            fi
            status=$(printf '%s' "$job" | jq -r '.status // "unknown"')
            case "$status" in
              completed)
                echo "job $job_id completed in $((i*5))s"
                exit 0 ;;
              failed)
                echo "::error::composer job failed"
                echo "--- error ---"
                echo "$job" | jq -r '.error // "(no error field)"'
                echo "--- output (last 4KB) ---"
                echo "$job" | jq -r '.output // ""' | tail -c 4096
                exit 1 ;;
              pending|running)
                : ;;
              *)
                echo "::warning::unexpected job status '$status' (raw: $job)" ;;
            esac
            sleep 5
          done
          echo "::error::composer job $job_id did not finish within 10 minutes"
          exit 1