name: Update Docs

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: docker-push
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Fetch docs, build, push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch docs
        timeout-minutes: 180
        run: pnpm fetch-docs
        env:
          DOCS_OUT_DIR: ${{ github.workspace }}/docs
          DOCS_WORK_DIR: /tmp/docs-work
          DOCS_MAX_AGE: "0"

      - name: Generate date + version tags
        id: tag
        run: |
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "version=$(git describe --tags --abbrev=0)-daily.$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.date }}
          build-args: |
            DOCS_PREBUILT=true
            VERSION=${{ steps.tag.outputs.version }}
            SSH_HOST=${{ vars.DOCS_SSH_HOST || 'docs.erfi.io' }}
            SSH_PORT=${{ vars.DOCS_SSH_PORT || '2222' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

