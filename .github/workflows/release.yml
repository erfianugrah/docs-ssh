name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: docker-push
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (typecheck, unit, e2e, tools.sh sync)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tools.sh is in sync
        run: pnpm generate:tools && git diff --exit-code commands/tools.sh

      - name: Typecheck
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:coverage

      - name: Run E2E tests
        run: pnpm test:e2e

  build-and-push:
    name: Build & push Docker image (tagged release)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch docs
        run: pnpm fetch-docs
        env:
          DOCS_OUT_DIR: ${{ github.workspace }}/docs
          DOCS_WORK_DIR: /tmp/docs-work
          DOCS_MAX_AGE: "0"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOCS_PREBUILT=true
            VERSION=${{ github.ref_name }}
            SSH_HOST=${{ vars.DOCS_SSH_HOST || 'docs.erfi.io' }}
            SSH_PORT=${{ vars.DOCS_SSH_PORT || '2222' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Composer (async)
        id: deploy
        # ?async=true returns {job_id} immediately; we poll the job in the
        # next step so failures surface composer's actual error rather than
        # a generic SSH-banner timeout 60s later.
        run: |
          response=$(curl -sf \
            --connect-timeout 30 \
            --max-time 60 \
            --retry 2 \
            --retry-delay 15 \
            --retry-connrefused \
            -X POST \
            "${{ secrets.COMPOSER_URL }}/api/v1/stacks/docs-ssh/deploy?async=true" \
            -H "Authorization: Bearer ${{ secrets.COMPOSER_API_KEY }}" \
            -H "X-Requested-With: XMLHttpRequest")
          echo "composer response: $response"
          job_id=$(echo "$response" | jq -r '.job_id // empty')
          if [ -z "$job_id" ]; then
            echo "::error::composer accepted deploy but returned no job_id"
            exit 1
          fi
          echo "Deploy queued, job_id=$job_id"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Composer job to finish
        # Polls /api/v1/jobs/{id} every 5s for up to 10 minutes. On 'failed'
        # surfaces composer's error+output to the CI log so we don't have to
        # SSH to the host to find out what went wrong.
        run: |
          job_id="${{ steps.deploy.outputs.job_id }}"
          for i in $(seq 1 120); do
            job=$(curl -sf \
              --connect-timeout 10 --max-time 20 \
              -H "Authorization: Bearer ${{ secrets.COMPOSER_API_KEY }}" \
              "${{ secrets.COMPOSER_URL }}/api/v1/jobs/$job_id" || echo '{}')
            status=$(echo "$job" | jq -r '.status // "unknown"')
            case "$status" in
              completed)
                echo "job $job_id completed in $((i*5))s"
                exit 0 ;;
              failed)
                echo "::error::composer job failed"
                echo "--- error ---"
                echo "$job" | jq -r '.error // "(no error field)"'
                echo "--- output (last 4KB) ---"
                echo "$job" | jq -r '.output // ""' | tail -c 4096
                exit 1 ;;
              pending|running)
                : ;;
              *)
                echo "::warning::unexpected job status '$status' (raw: $job)" ;;
            esac
            sleep 5
          done
          echo "::error::composer job $job_id did not finish within 10 minutes"
          exit 1

  smoke:
    name: Post-deploy smoke against live
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for live SSH banner
        # Composer's job is already 'completed' by the time we get here
        # (build-and-push only finishes after the job poll succeeds), but
        # the new container still needs ~5-15s for sshd inside it to be
        # ready. Bounded poll on banner exchange.
        run: |
          for i in $(seq 1 15); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o LogLevel=ERROR -o ConnectTimeout=2 \
                   -p 2222 docs@${{ vars.DOCS_SSH_HOST || 'docs.erfi.io' }} \
                   'echo ok' > /dev/null 2>&1; then
              echo "live server reachable after ${i}×2s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::live server unreachable after 30s; aborting smoke"
          exit 1

      - name: Smoke against live
        env:
          DOCS_SSH_HOST: ${{ vars.DOCS_SSH_HOST || 'docs.erfi.io' }}
          DOCS_SSH_PORT: ${{ vars.DOCS_SSH_PORT || '2222' }}
        run: pnpm test:smoke
