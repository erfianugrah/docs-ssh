name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: docker-push
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (typecheck, unit, e2e, tools.sh sync)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tools.sh is in sync
        run: pnpm generate:tools && git diff --exit-code commands/tools.sh

      - name: Typecheck
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:coverage

      - name: Run E2E tests
        run: pnpm test:e2e

  build-and-push:
    name: Build & push Docker image (tagged release)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Jinja2 (TRaSH-Guides converter)
        # pnpm fetch-docs renders TRaSH-Guides' full-Jinja templates via
        # src/ingestors/jinja-render.py; jinja2 is not pre-installed on
        # ubuntu-latest so it must be added here.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jinja2 package
        run: pip install jinja2

      - name: Fetch docs
        run: pnpm fetch-docs
        env:
          DOCS_OUT_DIR: ${{ github.workspace }}/docs
          DOCS_WORK_DIR: /tmp/docs-work
          DOCS_MAX_AGE: "0"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        timeout-minutes: 30
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOCS_PREBUILT=true
            VERSION=${{ github.ref_name }}
            SSH_HOST=${{ vars.DOCS_SSH_HOST || 'docs.erfi.io' }}
            SSH_PORT=${{ vars.DOCS_SSH_PORT || '2222' }}
          cache-from: type=gha
          # ignore-error: a stale/evicted gha cache manifest (not_found on
          # import or export) must never fail a release - the cache is an
          # optimization, the image push already succeeded by this point.
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Deploy to Composer (async)
        id: deploy
        # ?async=true returns {job_id} immediately; we poll the job in the
        # next step so failures surface composer's actual error rather than
        # a generic SSH-banner timeout 60s later.
        run: |
          resp_file="$(mktemp)"
          http_code=$(curl -s \
            --connect-timeout 30 \
            --max-time 120 \
            --retry 6 \
            --retry-delay 15 \
            --retry-connrefused \
            --retry-all-errors \
            -X POST \
            "${{ secrets.COMPOSER_URL }}/api/v1/stacks/docs-ssh/deploy?async=true" \
            -H "Authorization: Bearer ${{ secrets.COMPOSER_API_KEY }}" \
            -H "X-Requested-With: XMLHttpRequest" \
            -o "$resp_file" -w '%{http_code}')
          response=$(cat "$resp_file"); rm -f "$resp_file"
          echo "composer response (HTTP $http_code): $(printf '%s' "$response" | head -c 500)"

          # A non-JSON body means we reached something other than the API —
          # almost always the Caddy proof-of-work / WAF challenge page that
          # gets served to GitHub runner IPs. Surface that plainly instead of
          # a cryptic `jq: parse error: Invalid numeric literal`.
          if ! printf '%s' "$response" | jq -e . >/dev/null 2>&1; then
            echo "::error::composer deploy returned non-JSON (HTTP $http_code) — likely a WAF/proof-of-work challenge, not the API. Body (first 300 chars): $(printf '%s' "$response" | head -c 300 | tr '\n' ' ')"
            exit 1
          fi
          if [ "$http_code" != "200" ] && [ "$http_code" != "202" ]; then
            echo "::error::composer deploy failed with HTTP $http_code: $response"
            exit 1
          fi

          job_id=$(printf '%s' "$response" | jq -r '.job_id // empty')
          if [ -z "$job_id" ]; then
            echo "::error::composer accepted deploy but returned no job_id: $response"
            exit 1
          fi
          echo "Deploy queued, job_id=$job_id"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Composer job to finish
        # Polls /api/v1/jobs/{id} every 5s for up to 10 minutes. On 'failed'
        # surfaces composer's error+output to the CI log so we don't have to
        # SSH to the host to find out what went wrong.
        run: |
          job_id="${{ steps.deploy.outputs.job_id }}"
          for i in $(seq 1 120); do
            job=$(curl -sf \
              --connect-timeout 10 --max-time 20 --retry 2 --retry-all-errors \
              -H "Authorization: Bearer ${{ secrets.COMPOSER_API_KEY }}" \
              "${{ secrets.COMPOSER_URL }}/api/v1/jobs/$job_id" || echo '{}')
            if ! printf '%s' "$job" | jq -e . >/dev/null 2>&1; then
              echo "::warning::poll #$i got a non-JSON response (likely WAF/proof-of-work challenge); retrying"
              sleep 5; continue
            fi
            status=$(printf '%s' "$job" | jq -r '.status // "unknown"')
            case "$status" in
              completed)
                echo "job $job_id completed in $((i*5))s"
                exit 0 ;;
              failed)
                echo "::error::composer job failed"
                echo "--- error ---"
                echo "$job" | jq -r '.error // "(no error field)"'
                echo "--- output (last 4KB) ---"
                echo "$job" | jq -r '.output // ""' | tail -c 4096
                exit 1 ;;
              pending|running)
                : ;;
              *)
                echo "::warning::unexpected job status '$status' (raw: $job)" ;;
            esac
            sleep 5
          done
          echo "::error::composer job $job_id did not finish within 10 minutes"
          exit 1

  smoke:
    name: Post-deploy smoke against live
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for cascade redeploys to settle
        # build-and-push waits on its own deploy job_id, but composer can queue
        # *cascade* sync_redeploy jobs on dependent stacks ~30-60s later. The
        # canonical case: host-mode caddy on the same host fronts docs-ssh:2222
        # and is auto-redeployed when docs-ssh changes, which tears down the
        # public listener for ~10s mid-smoke. Poll the jobs API for any
        # in-flight job whose target is docs-ssh or caddy, and require a stable
        # window of clean polls before proceeding.
        env:
          COMPOSER_URL: ${{ secrets.COMPOSER_URL }}
          COMPOSER_API_KEY: ${{ secrets.COMPOSER_API_KEY }}
        run: |
          stable_window=6     # need 6 consecutive clean polls (~30s)
          max_iterations=72   # cap total wait at ~6 minutes
          poll_interval=5
          clean=0
          for i in $(seq 1 $max_iterations); do
            jobs=$(curl -sf \
              --connect-timeout 10 --max-time 20 --retry 2 --retry-all-errors \
              -H "Authorization: Bearer ${COMPOSER_API_KEY}" \
              "${COMPOSER_URL}/api/v1/jobs?limit=50" || echo '{"jobs":[]}')
            in_flight=$(echo "$jobs" | jq -r '
              .jobs[]?
              | select((.target == "docs-ssh" or .target == "caddy")
                       and (.status == "running" or .status == "pending"))
              | "\(.type)/\(.target)/\(.status)/\(.id)"' | head -5)
            if [ -n "$in_flight" ]; then
              echo "iter $i: in-flight related jobs:"
              echo "$in_flight" | sed 's/^/  /'
              clean=0
            else
              clean=$((clean + 1))
              echo "iter $i: no related in-flight jobs (clean=$clean/$stable_window)"
              if [ $clean -ge $stable_window ]; then
                echo "settled after $((i * poll_interval))s"
                exit 0
              fi
            fi
            sleep $poll_interval
          done
          echo "::error::cascade jobs did not settle within $((max_iterations * poll_interval))s"
          exit 1

      - name: Wait for live SSH banner
        # Composer's job is already 'completed' by the time we get here
        # (build-and-push only finishes after the job poll succeeds), but
        # the new container still needs ~5-15s for sshd inside it to be
        # ready. Bounded poll on banner exchange.
        run: |
          for i in $(seq 1 15); do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o LogLevel=ERROR -o ConnectTimeout=2 \
                   -p 2222 docs@${{ vars.DOCS_SSH_HOST || 'docs.erfi.io' }} \
                   'echo ok' > /dev/null 2>&1; then
              echo "live server reachable after ${i}×2s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::live server unreachable after 30s; aborting smoke"
          exit 1

      - name: Smoke against live
        env:
          DOCS_SSH_HOST: ${{ vars.DOCS_SSH_HOST || 'docs.erfi.io' }}
          DOCS_SSH_PORT: ${{ vars.DOCS_SSH_PORT || '2222' }}
        run: pnpm test:smoke
