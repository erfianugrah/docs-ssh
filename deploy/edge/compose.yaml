# docs-ssh - servarr variant (moved off the MS-01 router 2026-08-29).
# Managed by the edge composer instance (stack: docs-ssh), git-synced.
# Explicit project name REQUIRED (deploy/edge dir-name collision - one stack's
# `up --remove-orphans` would delete another's containers).
name: docs-ssh

# Stateless service: docs baked into the image, host keys ephemeral per
# container, no volumes. Servarr differences:
#   - no pinned bridge/subnet; ports publish on servarr's LAN IP instead
#   - edge Caddy terminates HTTP on 443 (reverse_proxy 10.0.71.2:18086) and
#     L4-proxies SSH :2222 -> 10.0.71.2:18087
services:
  docs-ssh:
    image: ghcr.io/erfianugrah/docs-ssh:latest
    container_name: docs-ssh
    hostname: docs-ssh
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN # entrypoint: ssh-keygen -A needs to write host keys
      - SETUID # sshd: drops privileges to docs user
      - SETGID # sshd: drops privileges to docs group
      - SYS_CHROOT # sshd: ChrootDirectory / privilege separation
      - AUDIT_WRITE # sshd: writes login records
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "10.0.71.2:18086:8080"
      - "10.0.71.2:18087:2222"
    tmpfs:
      - /tmp:size=16M
      - /run/sshd:size=1M
      - /var/log:size=8M
    environment:
      - TZ=UTC
      - DOCS_SSH_HOST=docs.erfi.io
      - DOCS_SSH_PORT=2222
    healthcheck:
      test:
        - CMD-SHELL
        - ssh -o StrictHostKeyChecking=no -o BatchMode=yes -p 2222
          docs@localhost 'echo ok' || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - docs

networks:
  docs:
    driver: bridge
