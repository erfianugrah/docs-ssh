# docs-ssh - servarr variant (moved off the MS-01 router 2026-08-29).
# Managed by the edge composer instance (stack: docs-ssh), git-synced.
# Explicit project name REQUIRED (deploy/edge dir-name collision - one stack's
# `up --remove-orphans` would delete another's containers).
name: docs-ssh

# Docs baked into the image; the state is the SSH host keys, kept in the
# `sshd` volume at /run/sshd so a redeploy does not change the host key (it
# did on every deploy until 2026-10-19; clients pin it), and the query log in
# the `logs` volume (DOCS_LOG_DIR; entrypoint.sh archives it per start and
# deletes archives older than 30 days). entrypoint.sh
# only runs ssh-keygen when /run/sshd has no key. Servarr differences:
#   - macvlan IP on servarr_lan (10.0.71.65), not host-published ports -
#     first-class LAN service, same class as copyparty/jellyfin
#   - edge Caddy terminates HTTP on 443 (reverse_proxy 10.0.71.65:8080) and
#     L4-proxies SSH :2222 -> 10.0.71.65:2222
services:
  docs-ssh:
    image: ghcr.io/erfianugrah/docs-ssh:latest
    container_name: docs-ssh
    hostname: docs-ssh
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN # entrypoint: ssh-keygen -A needs to write host keys
      - SETUID # sshd: drops privileges to docs user
      - SETGID # sshd: drops privileges to docs group
      - SYS_CHROOT # sshd: ChrootDirectory / privilege separation
      - AUDIT_WRITE # sshd: writes login records
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    expose:
      - 2222
      - 8080
    tmpfs:
      - /tmp:size=16M
      - /var/log:size=8M
    environment:
      - TZ=UTC
      - DOCS_SSH_HOST=docs.erfi.io
      - DOCS_SSH_PORT=2222
      - DOCS_LOG_DIR=/var/lib/docs-ssh/log
    healthcheck:
      test:
        - CMD-SHELL
        - ssh -o StrictHostKeyChecking=no -o BatchMode=yes -p 2222
          docs@localhost 'echo ok' || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - sshd:/run/sshd # host keys + per-start env/pid files
      - logs:/var/lib/docs-ssh/log # query log, 30-day retention
    networks:
      lan:
        ipv4_address: 10.0.71.65

volumes:
  sshd:
  logs:

networks:
  lan:
    external: true
    name: servarr_lan
